name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Ruff (lint)
        run: ruff check pdfproc tests scripts
      - name: Ruff (formato)
        run: ruff format --check pdfproc tests scripts
      - name: Pytest
        run: pytest -q

  docker:
    name: Build de imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      # El extractor (torch + Docling, varios GB) se omite para mantener el CI rápido.
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build indexer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/indexer.Dockerfile
          push: false
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,mode=max,scope=indexer
