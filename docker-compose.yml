x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_URL: http://elasticsearch:9200
  UPLOAD_DIR: /data/uploads

x-app-deps: &app-deps
  kafka-init:
    condition: service_completed_successfully
  elasticsearch:
    condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B="--bootstrap-server kafka:9092"
        $$T $$B --create --if-not-exists --topic pdf.ingest --partitions 6 --replication-factor 1
        $$T $$B --create --if-not-exists --topic pdf.chunks --partitions 12 --replication-factor 1 --config compression.type=producer
        $$T $$B --create --if-not-exists --topic pdf.dlq    --partitions 3 --replication-factor 1 --config retention.ms=1209600000
        $$T $$B --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - uploads:/data/uploads
    depends_on: *app-deps
    restart: unless-stopped

  extractor:
    build:
      context: .
      dockerfile: docker/extractor.Dockerfile
    environment:
      <<: *app-env
      UNSTRUCTURED_STRATEGY: ${UNSTRUCTURED_STRATEGY:-fast}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-false}
      DOCLING_ARTIFACTS_PATH: /models/docling
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1500}
      OMP_NUM_THREADS: ${EXTRACTOR_THREADS:-4}
    volumes:
      - uploads:/data/uploads:ro
    depends_on: *app-deps
    restart: unless-stopped
    stop_grace_period: 5m  # deja terminar el PDF en curso antes de matar el contenedor
    deploy:
      replicas: ${EXTRACTOR_REPLICAS:-1}

  indexer:
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    environment:
      <<: *app-env
      BATCH_MAX_RECORDS: ${BATCH_MAX_RECORDS:-500}
      BATCH_MAX_WAIT_MS: ${BATCH_MAX_WAIT_MS:-2000}
      BULK_MAX_RETRIES: ${BULK_MAX_RETRIES:-5}
    depends_on: *app-deps
    restart: unless-stopped
    deploy:
      replicas: ${INDEXER_REPLICAS:-1}

volumes:
  kafka-data:
  es-data:
  uploads:
